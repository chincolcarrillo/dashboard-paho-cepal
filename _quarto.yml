project:
  type: website
  output-dir: docs
  execute-dir: project

website:
  title: "Dashboard PAHO/CEPAL"
  description: "Comercio internacional de tecnologías sanitarias en América Latina y el Caribe."
  navbar:
    left:
      - text: "Inicio"
        href: dashboard/index.qmd
      - text: "Categorías"
        menu:
          - text: "Células, tejidos y terapias avanzadas"
            href: dashboard/terapias-avanzadas.qmd
          - text: "Diagnósticos in vitro"
            href: dashboard/diagnosticos-in-vitro.qmd
          - text: "Dispositivos médicos"
            href: dashboard/dispositivos-medicos.qmd
          - text: "Hemoderivados e inmunobiológicos"
            href: dashboard/hemoderivados-inmunobiologicos.qmd
          - text: "Ingredientes farmacéuticos activos"
            href: dashboard/ifas.qmd
          - text: "Medicamentos"
            href: dashboard/medicamentos.qmd
          - text: "Vacunas (humanas)"
            href: dashboard/vacunas-humanas.qmd
  page-footer:
    left: "Fuente: elaboración propia con base en CEPII-BACI y clasificación PAHO/CEPAL."
    right: "Dashboard PAHO/CEPAL"
  search: true
  reader-mode: false

format:
  html:
    theme:
      light: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: false
    code-tools: false
    smooth-scroll: true
    link-external-newwindow: true
    df-print: paged
    self-contained: false

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

lang: es
