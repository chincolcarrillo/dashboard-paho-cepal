project:
  type: website
  output-dir: docs
  execute-dir: project

website:
  title: "Dashboard PAHO/CEPAL"
  description: "Comercio internacional de medicamentos, tecnologías sanitarias, dispositivos médicos e insumos en América Latina y el Caribe."
  navbar:
    left:
      - text: "Inicio"
        href: dashboard/index.qmd
      - text: "Panorama regional"
        href: dashboard/panorama-regional.qmd
      - text: "Categorías"
        menu:
          - text: "── IFAs ──"
          - text: "Ingredientes farmacéuticos activos"
            href: dashboard/ifas.qmd
          - text: "── Medicamentos y otras tecnologías sanitarias ──"
          - text: "Células, tejidos y sustancias terapéuticas"
            href: dashboard/celulas-tejidos.qmd
          - text: "Medicamentos"
            href: dashboard/medicamentos.qmd
          - text: "Sangre, inmunoglobulinas y antisueros"
            href: dashboard/hemoderivados.qmd
          - text: "Vacunas (humanas)"
            href: dashboard/vacunas-humanas.qmd
          - text: "── Dispositivos médicos ──"
          - text: "Cuidado de heridas y dispositivos de protección"
            href: dashboard/cuidado-de-heridas-y-dispositivos-proteccion.qmd
          - text: "Dispositivos cardiovasculares"
            href: dashboard/dispositivos-cardiovasculares.qmd
          - text: "Dispositivos de diagnóstico in vitro y laboratorio"
            href: dashboard/diagnostico-in-vitro.qmd
          - text: "Dispositivos de diagnóstico por imagen"
            href: dashboard/diagnostico-por-imagen.qmd
          - text: "Dispositivos de esterilización y desinfección"
            href: dashboard/dispositivos-esterilizacion.qmd
          - text: "Dispositivos odontológicos"
            href: dashboard/dispositivos-odontologicos.qmd
          - text: "Dispositivos para rehabilitación y asistencia"
            href: dashboard/dispositivos-rehabilitacion.qmd
          - text: "Dispositivos quirúrgicos e invasivos"
            href: dashboard/dispositivos-quirurgicos.qmd
          - text: "Equipos de diagnóstico y monitoreo"
            href: dashboard/equipos-diagnostico.qmd
          - text: "Equipos de laboratorio"
            href: dashboard/equipos-laboratorio.qmd
          - text: "Equipos terapéuticos"
            href: dashboard/equipos-terapeuticos.qmd
          - text: "Insumos médicos y suministros para pacientes"
            href: dashboard/insumos-medicos-y-suministros.qmd
          - text: "Mobiliario médico y elementos de soporte"
            href: dashboard/mobiliario-medico.qmd
  page-footer:
    left: "Fuente: elaboración propia con base en CEPII-BACI y clasificación PAHO/CEPAL."
    right: "Dashboard PAHO/CEPAL"
  search: true
  reader-mode: false

format:
  html:
    theme:
      light: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: false
    code-tools: false
    smooth-scroll: true
    link-external-newwindow: true
    df-print: paged
    self-contained: false

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

lang: es
