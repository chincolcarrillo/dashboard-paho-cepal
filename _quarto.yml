project:
  type: website
  output-dir: docs

website:
  title: "Dashboard PAHO/CEPAL"
  description: "Dashboard sobre comercio internacional de productos farmacéuticos y tecnologías sanitarias en América Latina y el Caribe."
  navbar:
    left:
      - text: "Inicio"
        href: dashboard/index.qmd
      - text: "Tendencias globales"
        href: dashboard/participacion-lac-exportaciones.qmd
      - text: "Balance comercial"
        href: dashboard/balance-comercial.qmd
      - text: "Origen y destino regional"
        href: dashboard/origen-destino-regional.qmd
      - text: "Comercio intrarregional"
        href: dashboard/comercio-intrarregional.qmd
      - text: "Demo estático"
        href: dashboard/dashboard_salud_lac_estatico.qmd
  page-footer:
    left: "Fuente: elaboración propia con base en CEPII-BACI y clasificación PAHO/CEPAL."
    right: "Dashboard PAHO/CEPAL"
  search: true
  reader-mode: false

format:
  html:
    theme:
      light: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: false
    code-tools: false
    smooth-scroll: true
    link-external-newwindow: true
    df-print: paged
    self-contained: false

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

lang: es
